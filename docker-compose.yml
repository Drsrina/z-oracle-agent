# ==============================================================
# Z-Oracle Atendee — Self-Hosted Fullstack Stack
# Substitui Upstash por Redis local e Supabase por PostgreSQL (pgvector)
# ==============================================================

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis_db:6379/0
      - DATABASE_URL=postgresql://postgres:postgres@postgres_db:5432/zoracle
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
    depends_on:
      redis_db:
        condition: service_healthy
      postgres_db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_URL=http://api:8000
    depends_on:
      - api

  redis_db:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres_db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=zoracle
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zoracle"]
      interval: 5s
      timeout: 3s
      retries: 5

  db_studio:
    image: ghcr.io/libredb/libredb-studio:latest
    ports:
      - "5555:3000"
    environment:
      - STORAGE_PROVIDER=sqlite
    volumes:
      - libredb_data:/app/data
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  libredb_data:
